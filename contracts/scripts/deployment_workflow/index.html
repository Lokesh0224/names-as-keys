<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'">
  <title>Names as Keys — Unsigned Deployment Review</title>
  <link rel="stylesheet" href="style.css">
</head>
<body><main>
  <h1>Unsigned deployment review</h1>
  <p class="warning">Stage 3F NO-GO · Execution disabled</p>
  <pre id="identity">Loading reviewed candidate…</pre>
  <p id="status" role="status">Loading…</p>
  <section>
    <h2>Current step</h2>
    <label>Step <select id="step"></select></label>
    <button id="prepare" disabled>Prepare unsigned review</button>
    <pre id="review"></pre>
  </section>
  <section>
    <h2>Receipt review</h2>
    <label>Transaction hash <input id="hash" autocomplete="off"></label>
    <button id="receipt" disabled>Verify against session review</button>
    <pre id="journal"></pre>
  </section>
  <p><a href="demo.html">Synthetic workflow demonstration</a></p>
</main><script type="module" src="app.js"></script></body>
</html>
